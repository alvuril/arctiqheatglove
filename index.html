    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in preview environment
      window.addEventListener('error', function (event) {
        var msg = (event && event.message) ? String(event.message) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('@vite/client') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('Failed to construct')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = (event && event.reason) ? String(event.reason) : '';
        if (
          reason.includes('WebSocket') ||
          reason.includes('@vite/client') ||
          reason.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#08080a] text-slate-200 antialiased selection:bg-[#ff4d00] selection:text-white">
    <div id="root"></div>

  </body>
